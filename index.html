<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRM Reports — Monarch Collective</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #F8F9FB; color: #212121; min-height: 100vh; }
  .header { background: #222A35; color: #fff; padding: 2rem 2rem 1.5rem; }
  .header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: .25rem; }
  .header p { font-size: .95rem; color: #B0BEC5; }
  .container { max-width: 860px; margin: 2rem auto; padding: 0 1.5rem; }
  .report-card {
    background: #fff; border: 1px solid #E0E0E0; border-radius: 10px;
    padding: 1.25rem 1.5rem; margin-bottom: 1rem;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: box-shadow .15s, border-color .15s;
  }
  .report-card:hover { border-color: #1565C0; box-shadow: 0 2px 8px rgba(21,101,192,.12); }
  .report-info h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: .2rem; }
  .report-info .meta { font-size: .85rem; color: #757575; }
  .badge {
    display: inline-block; font-size: .7rem; font-weight: 600; text-transform: uppercase;
    padding: .2rem .55rem; border-radius: 4px; margin-left: .5rem; vertical-align: middle;
  }
  .badge-latest { background: #E8F5E9; color: #2E7D32; }
  .badge-archived { background: #F5F5F5; color: #757575; }
  .btn {
    display: inline-block; text-decoration: none; font-family: 'DM Sans', sans-serif;
    font-size: .85rem; font-weight: 600; padding: .5rem 1.1rem; border-radius: 6px;
    transition: background .15s;
  }
  .btn-primary { background: #1565C0; color: #fff; }
  .btn-primary:hover { background: #0D47A1; }
  .btn-outline { background: #fff; color: #1565C0; border: 1px solid #1565C0; }
  .btn-outline:hover { background: #E3F2FD; }
  .empty { text-align: center; color: #9E9E9E; padding: 3rem 1rem; }
  .footer { text-align: center; padding: 2rem; font-size: .8rem; color: #9E9E9E; }
</style>
</head>
<body>
<div class="header">
  <h1>VRM Reports</h1>
  <p>Monarch Collective — Versioned HTML Reports</p>
</div>
<div class="container" id="reports"></div>
<div class="footer">Hosted on GitHub Pages &middot; <a href="https://github.com/Ddingens/vrm-reports" style="color:#1565C0;">View Repository</a></div>

<script>
// Report registry — add new entries at the top
const reports = [
  {
    title: "Payroll Data Flow Map",
    file: "payroll_data_flow.html",
    date: "2026-03-11",
    description: "End-to-end visualization of payroll data flow from pay run to financials",
    latest: true
  }
];

const container = document.getElementById('reports');

if (reports.length === 0) {
  container.innerHTML = '<div class="empty">No reports yet.</div>';
} else {
  reports.forEach(r => {
    const badge = r.latest
      ? '<span class="badge badge-latest">Latest</span>'
      : '<span class="badge badge-archived">Archived</span>';
    const btn = r.latest
      ? `<a href="${r.file}" class="btn btn-primary">View Report</a>`
      : `<a href="${r.file}" class="btn btn-outline">View Report</a>`;
    container.innerHTML += `
      <div class="report-card">
        <div class="report-info">
          <h3>${r.title} ${badge}</h3>
          <div class="meta">${r.date} &middot; ${r.description}</div>
        </div>
        <div>${btn}</div>
      </div>`;
  });
}
</script>
</body>
</html>
